name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks and mobile bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Node version from EAS
        id: eas
        run: jq -er '.build.production.node | "node=\(.)"' eas.json >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.eas.outputs.node }}
          cache: npm

      - run: npm ci

      - name: Generate and verify Expo Router types
        env:
          EXPO_ROUTER_APP_ROOT: ${{ github.workspace }}/src/app
        run: |
          mkdir -p .expo/types
          node -e "require('./node_modules/@expo/router-server/build/typed-routes').regenerateDeclarations('.expo/types')"
          grep -Fq '/categories' .expo/types/router.d.ts

      - run: npx --no-install tsc --noEmit
      - run: npm run lint
      - run: npm test -- --runInBand

      - name: Export Android and iOS bundles
        run: npx --no-install expo export --platform android --platform ios

  dictionary:
    name: Dictionary pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -v
